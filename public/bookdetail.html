<!DOCTYPE html>
<!--
	書籍管理システム - 詳細画面（動的版）
	Vue.js + Express API + Google Books API
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="css/booklist.css" >
<link rel="stylesheet" type="text/css" href="css/bookdetail.css" >
<!-- vue.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<title>書籍管理システム</title>
</head>

<body>

<div id="app">
	<div id="header">
		<h1>書籍管理システム</h1>
	</div>

	<div id="main">

		<!-- ローディング表示 -->
		<div v-if="loading" style="text-align: center; padding: 20px;">
			<p>📖 読み込み中...</p>
		</div>

		<!-- エラー表示 -->
		<div v-if="error && !loading" style="background-color: #ffcccc; border: 1px solid #ff0000; padding: 10px; margin-bottom: 10px; color: #ff0000;">
			<p>❌ エラーが発生しました: {{ error }}</p>
			<p><a href="/booklist.html">📖 一覧画面に戻る</a></p>
		</div>

		<!-- 詳細情報 -->
		<fieldset id="detail" v-if="!loading && !error && book">
			<legend>{{ book.id }}-{{ book.branch }}</legend>

			<p>
				<span class="cap">タイトル</span>
				<span class="detailtext">{{ book.title }}</span>
			</p>

			<p>
				<span class="cap">サブタイトル</span>
				<span class="detailtext">{{ book.subtitle }}</span>
			</p>

			<p>
				<span class="cap">著者</span>
				<span class="detailtext">{{ book.writer }}</span>
			</p>

			<p>
				<span class="cap">出版</span>
				<span class="detailtext">{{ book.print }}</span>
			</p>

			<p>
				<span class="cap">登録日</span>
				<span class="detailtext">{{ book.recorddate }}</span>
			</p>

			<p>
				<span class="cap">購入方法</span>
				<span class="detailtext">{{ book.buy }}</span>
			</p>

			<p>
				<span class="cap">価格</span>
				<span class="detailtext">¥{{ book.price }}</span>
			</p>

			<!-- サムネイル画像 -->
			<p>
				<span class="detailtext">
					<img 
						:src="book.thumbnailUrl" 
						:alt="book.title"
						width="200"
						@error="handleImageError"
					>
				</span>
			</p>

		</fieldset>

	</div>
</div>

<script>
new Vue({
	el: '#app',
	data: {
		book: null,
		loading: true,
		error: null,
		bookId: null,
		bookBranch: null
	},
	methods: {
		/**
		 * URL パラメータから ID と branch を取得
		 */
		getUrlParams() {
			const params = new URLSearchParams(window.location.search);
			this.bookId = params.get('id');
			this.bookBranch = params.get('branch');

			if (!this.bookId || !this.bookBranch) {
				this.error = 'URLパラメータが不正です（id と branch が必須）';
				this.loading = false;
				return false;
			}
			return true;
		},

		/**
		 * 詳細データを取得
		 */
		async fetchBookDetail() {
			try {
				this.loading = true;
				this.error = null;

				const url = `/api/books/${this.bookId}/${this.bookBranch}`;
				const response = await fetch(url);

				if (!response.ok) {
					if (response.status === 404) {
						throw new Error('書籍が見つかりません');
					}
					throw new Error(`HTTP Error: ${response.status}`);
				}

				const data = await response.json();
				this.book = data;

				console.log(`✅ Book detail loaded:`, this.book);
			} catch (err) {
				console.error('❌ fetchBookDetail エラー:', err);
				this.error = err.message || 'データ読み込みエラーが発生しました';
			} finally {
				this.loading = false;
			}
		},

		/**
		 * 画像読み込みエラーハンドラ
		 */
		handleImageError() {
			console.warn('⚠️  画像読み込みエラー');
			this.book.thumbnailUrl = '/image/20200501_noimage.png';
		}
	},
	mounted() {
		console.log('🚀 Detail page Vue app mounted');
		
		if (this.getUrlParams()) {
			this.fetchBookDetail();
		}
	}
});
</script>

</body>
</html>
